name: Validate configuration & protocol

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "protocol/**"
      - "cheatsheets/**"
      - "hosts/**"
      - "scripts/**"
      - "docs/**"
      - "build.yaml"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
  pull_request:
    paths:
      - "config/**"
      - "protocol/**"
      - "cheatsheets/**"
      - "hosts/**"
      - "scripts/**"
      - "docs/**"
      - "build.yaml"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          enable-cache: true

      - name: Install Validation Dependencies
        run: uv sync --frozen --dev

      - name: Run Corne Keymap Invariant Checks
        run: uv run scripts/check_corne_keymap.py

      - name: Run Sofle Keymap Invariant Checks
        run: uv run scripts/check_sofle_keymap.py

      - name: Run Build & Manifest Validation
        run: uv run scripts/check_build_config.py

      - name: Run Multi-Host Protocol Validation
        run: uv run scripts/check_host_protocol.py

      - name: Run Generated Artifact & Freshness Validation
        run: uv run scripts/check_generated.py

      - name: Smoke-Test PDF Render with rsvg-convert
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          uv run scripts/generate_cheatsheet.py all --out-dir /tmp/cheatsheet-smoke-test
          test -f /tmp/cheatsheet-smoke-test/corne-cheatsheet.pdf
          test -s /tmp/cheatsheet-smoke-test/corne-cheatsheet.pdf
          test -f /tmp/cheatsheet-smoke-test/sofle-cheatsheet.pdf
          test -s /tmp/cheatsheet-smoke-test/sofle-cheatsheet.pdf
          uv run scripts/generate_host_cheatsheet.py --out-dir /tmp/cheatsheet-smoke-test
          test -f /tmp/cheatsheet-smoke-test/macos-omniwm-cheatsheet.pdf
          test -s /tmp/cheatsheet-smoke-test/macos-omniwm-cheatsheet.pdf
