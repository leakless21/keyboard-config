  <defs>
    <style><![CDATA[
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DejaVu Sans", Ubuntu, sans-serif; dominant-baseline: alphabetic; }
      .title { font-size: 42px; font-weight: 800; fill: #0f172a; letter-spacing: 1px; }
