  <g class="panel" data-panel="BEHAVIOR NOTES">
    <rect x="1470.0" y="1195.0" width="1430.0" height="835.0" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <rect x="1494.0" y="1220.0" width="7" height="38" rx="3.5" fill="#4f46e5" />
  <text x="1522.0" y="1248.0" class="panel-title">BEHAVIOR NOTES</text>
  <text x="1522.0" y="1278.0" class="panel-subtitle">The same semantic actions follow the active layout</text>
  <text x="1510.0" y="1330.0" class="note-title" fill="#0284c7">Niri:</text>
  <text x="1510.0" y="1365.0" class="note-body">Size → 33 / 50 / 67 / 100% container span</text>
  <text x="1510.0" y="1435.0" class="note-title" fill="#c026d3">Dwindle:</text>
  <text x="1510.0" y="1470.0" class="note-body">Size → cycle split ratio when a workspace selects Dwindle</text>
  <text x="1510.0" y="1540.0" class="note-title" fill="#4f46e5">Quake</text>
  <text x="1510.0" y="1575.0" class="note-body">= OmniWM embedded persistent drop-down terminal</text>
  <text x="1510.0" y="1648.0" class="note-title" fill="#4f46e5">NewTerm</text>
  <text x="1510.0" y="1683.0" class="note-body">= independent Ghostty window in current workspace</text>
  <text x="1510.0" y="1756.0" class="note-title" fill="#4f46e5">Hold Option ~200 ms</text>
  <text x="1510.0" y="1791.0" class="note-body">= reveal OmniWM workspace bar after ~200 ms</text>
  <text x="1510.0" y="1972.0" class="note-footer" fill="#475569">Launch shortcuts and workspace shortcuts remain separate concepts.</text>
