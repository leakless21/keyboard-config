# Canonical macOS AeroSpace configuration for the HOST layer semantic protocol.
# Install this file at ~/.config/aerospace/aerospace.toml; see docs/hosts/macos.md.

config-version = 2
start-at-login = true
persistent-workspaces = ["WEB", "DEV", "COMMS", "RUN", "AUX"]

key-mapping.preset = "qwerty"
# Hard-purpose applications are routed; contextual apps (e.g. Ghostty) stay where opened.
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace DEV']

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = ['move-node-to-workspace WEB']

[[on-window-detected]]
if.app-id = 'dev.vencord.vesktop'
run = ['move-node-to-workspace COMMS']

[mode.main.binding]
# Laptop keyboard: ordinary QWERTY macOS semantics remain unchanged.
alt-1 = 'workspace WEB'
alt-2 = 'workspace DEV'
alt-3 = 'workspace COMMS'
alt-4 = 'workspace RUN'
alt-5 = 'workspace AUX'

alt-shift-1 = 'move-node-to-workspace WEB; workspace WEB'
alt-shift-2 = 'move-node-to-workspace DEV; workspace DEV'
alt-shift-3 = 'move-node-to-workspace COMMS; workspace COMMS'
alt-shift-4 = 'move-node-to-workspace RUN; workspace RUN'
alt-shift-5 = 'move-node-to-workspace AUX; workspace AUX'

# Directional navigation and window movement (used by laptop and Corne via Karabiner)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Window state and mode transitions
alt-r = 'mode resize'
alt-shift-semicolon = 'mode service'
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-tab = 'workspace-back-and-forth'
alt-backtick = 'focus-back-and-forth'

# Application shortcuts
alt-b = 'exec-and-forget open -a Zen'
alt-enter = 'exec-and-forget open -n -a Ghostty'

# Legacy / direct fallback bindings for raw F13-F20 signals (without Karabiner)
f13 = 'workspace WEB'
f14 = 'workspace DEV'
f15 = 'workspace COMMS'
f16 = 'workspace RUN'
f17 = 'workspace AUX'
shift-f13 = 'move-node-to-workspace WEB; workspace WEB'
shift-f14 = 'move-node-to-workspace DEV; workspace DEV'
shift-f15 = 'move-node-to-workspace COMMS; workspace COMMS'
shift-f16 = 'move-node-to-workspace RUN; workspace RUN'
shift-f17 = 'move-node-to-workspace AUX; workspace AUX'
shift-f18 = 'mode resize'
f18 = 'workspace-back-and-forth'
f19 = 'fullscreen'
f20 = 'layout floating tiling'
ctrl-f13 = 'focus left'
ctrl-f14 = 'focus down'
ctrl-f15 = 'focus up'
ctrl-f16 = 'focus right'
ctrl-shift-f13 = 'move left'
ctrl-shift-f14 = 'move down'
ctrl-shift-f15 = 'move up'
ctrl-shift-f16 = 'move right'
[mode.resize.binding]
# Corne directional resize via Karabiner Alt chords
alt-h = 'resize width -50'
alt-j = 'resize height +50'
alt-k = 'resize height -50'
alt-l = 'resize width +50'

# Laptop keyboard modal resize (bare letters)
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'

# Legacy direct fallback bindings
ctrl-f13 = 'resize width -50'
ctrl-f14 = 'resize height +50'
ctrl-f15 = 'resize height -50'
ctrl-f16 = 'resize width +50'

enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
# Structural / tree surgery operations. One-shot commands return to main mode.
# Directional tree join
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
alt-h = ['join-with left', 'mode main']
alt-j = ['join-with down', 'mode main']
alt-k = ['join-with up', 'mode main']
alt-l = ['join-with right', 'mode main']

# Directional window swap
shift-h = ['swap left', 'mode main']
shift-j = ['swap down', 'mode main']
shift-k = ['swap up', 'mode main']
shift-l = ['swap right', 'mode main']
alt-shift-h = ['swap left', 'mode main']
alt-shift-j = ['swap down', 'mode main']
alt-shift-k = ['swap up', 'mode main']
alt-shift-l = ['swap right', 'mode main']

# Tree manipulation
b = ['balance-sizes', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
t = ['layout tiles', 'mode main']
a = ['layout accordion', 'mode main']

# Monitor management
m = ['move-node-to-monitor --focus-follows-window next', 'mode main']
shift-m = ['move-workspace-to-monitor --wrap-around next', 'mode main']

# Exit service mode
enter = 'mode main'
esc = 'mode main'
