# keymap-drawer v0.23.0 configuration.
# The workflow fetches ZMK modules from config/west.yml before parsing.
draw_config:
  n_columns: 2
  shrink_wide_legends: 8
  footer_text: "Personal Keyboard Config • generated by keymap-drawer"
parse_config:
